standards:
- id: opentelemetry-otlp
  conforms: true
  evidence: 'Laminar is OpenTelemetry-native and serves the standard OTLP trace endpoint at
    /v1/traces, accepting gRPC, HTTP+protobuf and HTTP+JSON encodings. Any OpenTelemetry-capable
    runtime can send spans without a Laminar SDK.'
  docs: https://laminar.sh/docs/tracing/otel
- id: model-context-protocol
  conforms: true
  evidence: 'Official hosted MCP server at https://api.lmnr.ai/v1/mcp over HTTP transport, exposing
    ask_agent, query_laminar_sql and get_trace_context; documented client configs for Claude Code,
    Cursor and Codex.'
  docs: https://laminar.sh/docs/platform/mcp
- id: oauth2-device-authorization-grant
  conforms: true
  evidence: 'lmnr-cli login implements an OAuth 2.0 device flow (RFC 8628) — prints a verification URL
    and code, stores a short-lived access token refreshed automatically as it nears expiry.'
  docs: https://laminar.sh/docs/platform/cli#authenticate
- id: rfc6750-bearer-token
  conforms: true
  evidence: 'HTTP API, OTLP ingest and MCP server all authenticate with Authorization: Bearer
    <project_api_key>.'
- id: agent-skills
  conforms: true
  evidence: 'Laminar publishes a first-party agent skill at github.com/lmnr-ai/lmnr-skills, installed
    into .claude/, .cursor/, .codex/ or .agents/ by lmnr-cli setup.'
- id: llms-txt
  conforms: true
  evidence: 'Publishes https://laminar.sh/docs/llms.txt (and llms-full.txt); every docs page is also
