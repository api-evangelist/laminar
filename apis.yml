aid: laminar
name: Laminar
description: 'Laminar is an open-source, OpenTelemetry-native observability and debugging platform
  built for AI agents and LLM applications. It traces every LLM call, tool call, and sub-agent a run
  produces, renders each trace as a readable transcript rather than a raw span tree, and turns that
  data into answers: a record-and-replay Debugger that serves everything before your change from cache
  so each iteration takes seconds, and Signals that let you describe outcomes and failures in plain
  language and extract structured events across all traces for clustering and alerting. The platform
  adds evaluations, datasets and labeling queues, a playground, full-text search, custom dashboards,
  and read-only ClickHouse SQL over trace data from the UI, the lmnr-cli, or a hosted MCP server.
  Laminar ships TypeScript and Python SDKs with auto-instrumentation for the Vercel AI SDK, Claude
  Agent SDK, OpenAI Agents SDK, LangChain/LangGraph, Pydantic AI, Browser Use, Playwright and more,
  and can run as managed Laminar Cloud or fully self-hosted via Docker Compose or Kubernetes/Helm.'
