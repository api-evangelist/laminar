apis:
- aid: laminar:laminar-sql-query-api
  name: Laminar SQL Query API
  humanURL: https://laminar.sh/docs/platform/sql-editor
  baseURL: https://api.lmnr.ai
  tags:
  - SQL
  - Traces
  - Spans
  - Analytics
  description: 'Run SELECT-only ClickHouse SQL over a project''s observability data via POST
    /v1/sql/query. Authenticates with a project API key as a bearer token, accepts a query plus typed
    {name:Type} parameters, and returns rows as a JSON data array. Queryable tables are spans, traces,
    events, tags, dataset_datapoints, dataset_datapoint_versions and evaluation_datapoints; queries
    are automatically scoped to the calling project so no tenant filter is required.'
  properties:
  - url: https://laminar.sh/docs/platform/sql-editor
    type: Documentation
  - url: https://github.com/lmnr-ai/lmnr-skills/blob/main/skills/laminar/references/sql-query-api.md
    type: APIReference
- aid: laminar:laminar-otlp-trace-ingest-api
  name: Laminar OpenTelemetry Trace Ingest API
  humanURL: https://laminar.sh/docs/tracing/otel
  baseURL: https://api.lmnr.ai
  tags:
  - OpenTelemetry
  - OTLP
  - Tracing
  - Ingest
  description: 'The standard OpenTelemetry trace ingest endpoint at /v1/traces. Laminar accepts OTLP
    over gRPC, HTTP+protobuf, and (since May 2026) HTTP+JSON, so any OpenTelemetry-capable runtime —
    including browser SDKs without a protobuf encoder — can send spans without the Laminar SDK.
    Authenticated with a project API key; gRPC ingest is served on port 8443 for Laminar Cloud.'
  properties:
  - url: https://laminar.sh/docs/tracing/otel
    type: Documentation
  - url: https://laminar.sh/docs/tracing/introduction
    type: Tracing
- aid: laminar:laminar-evaluations-api
  name: Laminar Evaluations API
  humanURL: https://laminar.sh/docs/evaluations/manual-evaluation
  baseURL: https://api.lmnr.ai
  tags:
  - Evaluations
  - Datasets
  - Scoring
  description: 'The lower-level LaminarClient.evals surface for wiring evaluations into an existing
    pipeline: create an evaluation, pre-register each datapoint so a row is visible in the UI before
    the executor runs, then update that datapoint with a trace id, executor output, and scores.
    Because update can be called any time after create, the executor and the scorer can run in
    different processes, which supports async LLM-judge scoring and pure backfills of scored rows.'
  properties:
  - url: https://laminar.sh/docs/evaluations/manual-evaluation
    type: Documentation
  - url: https://laminar.sh/docs/sdk/client
    type: APIReference
